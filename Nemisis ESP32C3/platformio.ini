; ESP32-C3 co-processor firmware for the Nemisis micromouse board.
; Separate PlatformIO project from the STM32G474 firmware (sibling folder).
; The two MCUs are separate programs that talk over a bus on the PCB.

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; --- Upload / monitor over the C3's built-in native USB (USB-Serial/JTAG) ---
; The C3 enumerates as its own USB-CDC port, no external CP2102/CH340 needed.
upload_protocol = esptool
monitor_speed = 115200

; Route Serial.* to the native USB-CDC port (not UART0) and bring `it up at boot,
; so Serial works the moment the sketch starts without an external serial chip.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Tip: if the board doesn't reset into the bootloader automatically, hold BOOT,
; tap RESET, release BOOT, then upload once. After that auto-reset usually works.
