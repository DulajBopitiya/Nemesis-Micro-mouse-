[platformio]
; STM32CubeMX puts sources in Core/Src and headers in Core/Inc
src_dir = Core/Src
include_dir = Core/Inc
; Keep the normal (0x08000000) build as the default so `pio run` / the IDE build
; are unchanged. The relocated OTA app is opt-in: `pio run -e app_ota`.
default_envs = nucleo_g474re

[env:nucleo_g474re]
platform = ststm32
board = nucleo_g474re
framework = stm32cube
; change microcontroller
board_build.mcu = stm32g474ret6
; change MCU frequency
board_build.f_cpu = 160000000L

; on-board ST-Link (also used for debugging)
upload_protocol = jlink
debug_tool = jlink

; Use the in-repo capped linker script (500K app region) instead of the
; PlatformIO package default (512K, no carve-out). Keeps the app out of the
; top 3 persistent flash pages (maze/cal/settings). See linker/ header comment.
board_build.ldscript = linker/STM32G474RETX_FLASH.ld

build_flags =
    -I Core/Inc
    ; This is a CUSTOM board with a 24 MHz HSE crystal, not a real Nucleo (which
    ; uses 8 MHz from the ST-Link MCO). The framework injects HSE_VALUE=8000000
    ; for this board id, which makes SystemCoreClock (and SysTick/HAL_Delay) wrong.
    ; Force it to the real crystal frequency. Must match the CubeMX HSE input.
    -D HSE_VALUE=24000000

; ---------------------------------------------------------------------------
; OTA-relocated app: identical firmware, based at 0x08008000 (leaving the
; bottom 32 KB for the bootloader) with its vector table moved to match. Built
; opt-in with `pio run -e app_ota`; flashed alongside the bootloader project.
; The stock env:nucleo_g474re above stays the untouched 0x08000000 recovery
; image. See linker/app_reloc.ld and bootloader/.
; ---------------------------------------------------------------------------
[env:app_ota]
extends = env:nucleo_g474re
board_build.ldscript = linker/app_reloc.ld
build_flags =
    ${env:nucleo_g474re.build_flags}
    ; relocate the vector table to the app base. main.c sets SCB->VTOR =
    ; APP_VTOR_BASE explicitly (see USER CODE BEGIN 1) - unambiguous, unlike the
    ; framework's VECT_TAB_OFFSET macro which collides with a redefinition.
    -D APP_VTOR_BASE=0x08008000

