; NEMESIS OTA bootloader - standalone PlatformIO project, kept separate from the
; app build so it can never disturb it. Owns the bottom 32 KB of flash
; (0x08000000, boot.ld) and is what runs on reset. Flash it ONCE via J-Link; it
; is never OTA-updated.
;
;   pio run                 # build bootloader/.pio/build/boot/firmware.bin
;   pio run -t upload       # flash to 0x08000000 via J-Link
;
; Recovery: flashing a normal 0x08000000-based app build (the main project's
; env:nucleo_g474re) overwrites this bootloader and boots directly - the SWD net.

[env:boot]
platform = ststm32
board = nucleo_g474re
framework = stm32cube
board_build.mcu = stm32g474ret6
board_build.f_cpu = 160000000L

upload_protocol = jlink
debug_tool = jlink

board_build.ldscript = boot.ld

build_flags =
    ; custom 24 MHz HSE crystal (see the app project's note) - harmless here as
    ; the bootloader doesn't configure the PLL, but keep it consistent.
    -D HSE_VALUE=24000000
